{# Modal konfirmasi hapus, judul diisi dan dikonfirmasi lewat JavaScript. #}
<div id="delete-experience-modal"
     class="project-delete-modal"
     popover="auto"
     role="alertdialog"
     aria-modal="true"
     aria-labelledby="delete-experience-title">
    <button type="button"
            class="project-delete-modal__backdrop"
            popovertarget="delete-experience-modal"
            popovertargetaction="hide"
            aria-label="Tutup konfirmasi hapus"></button>

    <div class="project-delete-modal__content">
        <button type="button"
                class="project-delete-modal__close"
                popovertarget="delete-experience-modal"
                popovertargetaction="hide"
                aria-label="Tutup konfirmasi hapus">×</button>

        <h2 id="delete-experience-title">Hapus Experience?</h2>

        <p>
            Apakah Anda yakin ingin menghapus
            <strong id="delete-experience-name"></strong>?
        </p>

        <div class="project-delete-modal__actions">
            <button type="button"
                    class="button button-secondary"
                    popovertarget="delete-experience-modal"
                    popovertargetaction="hide">Batal</button>
            <button type="button"
                    id="confirm-delete-button"
                    class="button button-danger">Ya, Hapus</button>
        </div>
    </div>
</div>
