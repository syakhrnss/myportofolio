{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ name }} - Portfolio</title>
  
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>
    <header>
    <nav class="navbar" aria-label="Main navigation">
        <input type="checkbox" class="navbar__checkbox" id="navToggle">
        <label class="navbar__toggle" for="navToggle" aria-label="Toggle navigation menu">
            <span></span><span></span><span></span>
        </label>
        <ul class="navbar__list" id="navList">
            <li><a class="navbar__link" href="{% url 'main:show_main' %}">Profile</a></li>
            <li><a class="navbar__link" href="{% url 'main:show_main' %}#about">About</a></li>
            <li><a class="navbar__link" href="{% url 'main:show_experience' %}">Experience</a></li>
            <li><a class="navbar__link" href="{% url 'main:show_projects' %}">Projects</a></li>
            <li><a class="navbar__link" href="{% url 'main:show_main' %}#contact">Contact</a></li>
        </ul>
    </nav>
  </header>
  {% block content %} {% endblock content %}

  <footer class="site-footer">
      <div class="container">
          <p>&copy; 2026 {{ name }}. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
      </div>
  </footer>
</body>

</html>
